<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI音声が与える心理的影響についての聴取実験</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

<header class="w-full bg-white shadow-sm border-b border-slate-200 py-3 sm:py-4 px-4 sm:px-6 mb-4 sm:mb-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-2.5 sm:space-x-3">
            <div class="w-8 h-8 shrink-0 rounded-lg bg-sky-400 flex items-center justify-center text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24">
                    <path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4" />
                </svg>
            </div>
            <h1 class="text-sm sm:text-lg font-semibold text-slate-900 leading-snug">AI音声が与える心理的影響についての聴取実験</h1>
        </div>
    </div>
</header>



    <main class="max-w-2xl mx-auto w-full px-4 mb-12 flex-grow">
	<section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8">
    <h2 class="text-lg sm:text-xl font-bold text-slate-900 mb-4">はじめに</h2>           <div class="prose prose-slate text-sm text-slate-600 mb-6 space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                <p><strong>【実験目的】</strong>
                			<br>AIを用いた音声を聞いた際の意思決定傾向および心理的印象の調査</p>
                <p><strong>【所要時間】</strong>
                			<br>約3～5分程度</p>
                <p><strong>【注意事項】</strong>
                			<br>音声が再生されるので<strong>イヤホンまたはスピーカーの音量を適切な大きさに設定</strong>してください（イヤホン推奨）
                			<br>各質問では<strong>音声を最後まで聞いてからボタンを押してください</strong></p>
            </div>

            <div id="validationError" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-xl"></div>

            <form onsubmit="return false;" class="space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    				<div>
        		<label class="block text-sm font-semibold text-slate-700 mb-1">年齢 <span class="text-rose-500">*</span></label>
        		<select id="participantAge" class="w-full px-4 py-3 sm:py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-base sm:text-sm bg-white" required>                            
							<option value="">選択してください</option>
                            <option value="teens">10代</option>
                            <option value="twenties">20代</option>
                            <option value="thirties">30代</option>
                            <option value="forties">40代</option>
                            <option value="fifties_over">50代以上</option>
                            <option value="other">回答しない</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">性別 <span class="text-rose-500">*</span></label>
                        <select id="participantAge" class="w-full px-4 py-3 sm:py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-base sm:text-sm bg-white" required>
                            <option value="">選択してください</option>
                            <option value="male">男性</option>
                            <option value="female">女性</option>
                            <option value="other">回答しない</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-200">
                    <button type="button" onclick="startExperiment()" class="w-full bg-sky-400 hover:bg-sky-500 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 shadow-sm flex items-center justify-center space-x-2">
                        <span>音声のテストへ</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>
        </section>
    </main>



    <script src="common.js"></script>
    <script>
        function startExperiment() {
            const ageInput = document.getElementById('participantAge');
            const genderInput = document.getElementById('participantGender');
            const errorDiv = document.getElementById('validationError');

            errorDiv.classList.add('hidden');
            errorDiv.textContent = '';

            if (!ageInput.value) {
                errorDiv.textContent = '※ 年齢を選択してください';
                errorDiv.classList.remove('hidden');
                ageInput.focus();
                return;
            }
            if (!genderInput.value) {
                errorDiv.textContent = '※ 性別を選択してください';
                errorDiv.classList.remove('hidden');
                genderInput.focus();
                return;
            }

            const expState = {
                participant: {
                    id: 'P_' + Math.random().toString(36).substring(2, 7).toUpperCase(),
                    age: ageInput.value,
                    gender: genderInput.value
                },
                results: []
            };
            saveExpState(expState);

            window.location.href = 'audiotest.html';
        }
    </script>
</body>
</html>
