<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実験</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

 <header class="w-full bg-white shadow-sm border-b border-slate-200 py-3 sm:py-4 px-4 sm:px-6 mb-4 sm:mb-6">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2.5 sm:gap-0">
        <div class="flex items-center space-x-2.5 sm:space-x-3">
            <div class="w-7 h-7 sm:w-8 sm:h-8 shrink-0 rounded-lg bg-sky-400 flex items-center justify-center text-white">
                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24">
                    <path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4" />
                </svg>
            </div>
            <h1 class="text-sm sm:text-lg font-semibold text-slate-900 leading-snug">AI音声が与える心理的影響についての聴取実験</h1>
        </div>
        <div class="flex items-center justify-between sm:justify-end space-x-3 w-full sm:w-auto">
            <span id="trialCounter" class="text-xs sm:text-sm font-medium text-slate-500 shrink-0"> 1 / 8</span>
            <div class="flex-grow sm:flex-grow-0 sm:w-32 bg-slate-200 rounded-full h-2 sm:h-2.5 overflow-hidden">
                <div id="progressBar" class="bg-sky-400 h-2 sm:h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </div>
</header>

    <main class="max-w-2xl mx-auto w-full px-4 mb-12 flex-grow">
        <section class="space-y-6">

            <!-- Scenario Play Button Box -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-500">音声を再生してください</span>
                    <span id="playStatusBadge" class="text-xs font-semibold text-sky-600">▶ 再生</span>
                </div>
                
                <button type="button" id="scenarioPlayBtn" onclick="triggerTrialAudio()" class="w-full text-lg md:text-xl font-medium text-slate-900 leading-relaxed bg-slate-50 hover:bg-sky-50 active:scale-[0.99] p-6 rounded-xl border-2 border-slate-200 hover:border-sky-400 min-h-[110px] flex flex-col items-center justify-center text-center transition cursor-pointer shadow-sm">
                    <span id="scenarioTextBox"></span>
                    <span id="playSubLabel" class="mt-3 inline-flex items-center space-x-1 text-xs font-semibold text-sky-600 bg-white px-3 py-1 rounded-full border border-sky-200">
                        <span>音声を聞く</span>
                    </span>
                </button>
            </div>

            <!-- Decision Options Box -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-4">
                <div class="space-y-1">
                    <h3 class="text-sm font-semibold text-slate-700">【設問1】あなたはこのプランに申し込みたいと思いますか？</h3>
                    <p id="audioInstructionBanner" class="text-xs font-semibold text-amber-600 flex items-center space-x-1">
                        <span>音声を最後まで聞いてからボタンを押してください</span>
                    </p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    <button type="button" id="btnChoiceA" disabled onclick="handleDecision(this.dataset.value)" data-value="申し込む" class="decision-btn disabled:opacity-40 disabled:cursor-not-allowed border-2 border-slate-200 enabled:hover:border-sky-600 enabled:hover:bg-sky-50/50 text-slate-800 font-semibold py-4 px-6 rounded-xl transition duration-150 flex flex-col items-center justify-center text-center space-y-1">
                        <span class="text-base text-sky-900">申し込む</span>
                    </button>
                    
                    <button type="button" id="btnChoiceB" disabled onclick="handleDecision(this.dataset.value)" data-value="申し込まない" class="decision-btn disabled:opacity-40 disabled:cursor-not-allowed border-2 border-slate-200 enabled:hover:border-sky-600 enabled:hover:bg-sky-50/50 text-slate-800 font-semibold py-4 px-6 rounded-xl transition duration-150 flex flex-col items-center justify-center text-center space-y-1">
                        <span class="text-base text-sky-900">申し込まない</span>
                    </button>
                </div>
            </div>

            <!-- Likert Evaluation Box -->
            <div id="anxietyBox" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-5">
                <div>
                    <h3 class="text-sm font-semibold text-slate-800">【設問2】音声を聞いた際にどの程度 信頼 または 不安 を感じましたか？</h3>
                </div>

                <div class="grid grid-cols-5 gap-2 pt-2">
                    <button type="button" onclick="handleAnxietyRating(1)" class="likert-btn border border-slate-200 hover:bg-slate-100 rounded-xl py-3 text-center transition">
                        <span class="block text-lg font-bold text-slate-800">
							1</span>
                        <span class="block text-[10px] text-slate-500 mt-0.5">
							非常に信頼できる</span>
                    </button>
                    <button type="button" onclick="handleAnxietyRating(2)" class="likert-btn border border-slate-200 hover:bg-slate-100 rounded-xl py-3 text-center transition">
                        <span class="block text-lg font-bold text-slate-800">
							2</span>
                        <span class="block text-[10px] text-slate-500 mt-0.5">
							やや信頼できる</span>
                    </button>
                    <button type="button" onclick="handleAnxietyRating(3)" class="likert-btn border border-slate-200 hover:bg-slate-100 rounded-xl py-3 text-center transition">
                        <span class="block text-lg font-bold text-slate-800">
							3</span>
                        <span class="block text-[10px] text-slate-500 mt-0.5">
							どちらとも言えない</span>
                    </button>
                    <button type="button" onclick="handleAnxietyRating(4)" class="likert-btn border border-slate-200 hover:bg-slate-100 rounded-xl py-3 text-center transition">
                        <span class="block text-lg font-bold text-slate-800">
							4</span>
                        <span class="block text-[10px] text-slate-500 mt-0.5">
							やや不安に思う</span>
                    </button>
                    <button type="button" onclick="handleAnxietyRating(5)" class="likert-btn border border-slate-200 hover:bg-slate-100 rounded-xl py-3 text-center transition">
                        <span class="block text-lg font-bold text-slate-800">
							5</span>
                        <span class="block text-[10px] text-slate-500 mt-0.5">
							非常に不安に思う</span>
                    </button>
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="button" id="btnNextTrial" disabled onclick="submitTrialAndNext()" class="bg-sky-400 disabled:opacity-50 hover:bg-sky-500 text-white font-semibold py-2.5 px-6 rounded-xl transition text-sm">
                        次の問題へ進む ➔
                    </button>
                </div>
            </div>

        </section>
    </main>

    <script src="common.js"></script>
    <script>
        const expState = loadExpState();
        if (!expState.participant.id) {
            window.location.href = 'index.html';
        }

        let currentTrialIndex = expState.results.length;
        let decisionStartTime = null;
        let reactionTimeMs = null;
        let selectedChoice = null;
        let selectedAnxiety = null;
        let audioFinishedOnce = false;

        // すでに8問完了済みなら完了画面へ
        if (currentTrialIndex >= TRIAL_CONFIG.length) {
            window.location.href = 'complete.html';
        } else {
            loadTrial(currentTrialIndex);
        }

        function loadTrial(index) {
            currentTrialIndex = index;
            const currentTrial = TRIAL_CONFIG[index];

            selectedChoice = null;
            selectedAnxiety = null;
            reactionTimeMs = null;
            decisionStartTime = null;
            audioFinishedOnce = false;

            document.getElementById('trialCounter').textContent = `${index + 1} / ${TRIAL_CONFIG.length}`;
			const progressPercent = (index / TRIAL_CONFIG.length) * 100;
			document.getElementById('progressBar').style.width = `${progressPercent}%`;
            
            const btnA = document.getElementById('btnChoiceA');
            const btnB = document.getElementById('btnChoiceB');
            const banner = document.getElementById('audioInstructionBanner');
            btnA.disabled = true;
            btnB.disabled = true;
            banner.className = "text-xs font-semibold text-amber-600 flex items-center space-x-1";
            banner.innerHTML = "<span>🎧 音声を最後まで聞いてからボタンを押してください</span>";

           document.getElementById('scenarioTextBox').textContent = currentTrial.text;
		   document.getElementById('playStatusBadge').textContent = "▶ クリックして再生";
		   document.getElementById('playSubLabel').innerHTML = "<span>🔊 ここを押して音声を聞く</span>";
		   document.getElementById('scenarioPlayBtn').classList.remove('border-sky-400', 'bg-sky-50');
		   document.getElementById('scenarioPlayBtn').classList.add('border-slate-200', 'bg-slate-50');

		   document.getElementById('anxietyBox').classList.add('hidden');
		   document.getElementById('btnNextTrial').disabled = true;

		   document.querySelectorAll('.decision-btn').forEach(btn => {
    		btn.classList.remove('border-sky-400', 'bg-sky-100');
    		btn.classList.add('border-slate-200');
		});
		   document.querySelectorAll('.likert-btn').forEach(btn => {
    		btn.classList.remove('bg-sky-100', 'border-sky-400', 'text-sky-900');
    		btn.classList.add('border-slate-200');
		});

        }

      function triggerTrialAudio() {
            const currentTrial = TRIAL_CONFIG[currentTrialIndex];
            const pitchVal = currentTrial.pitch === 'High' ? 1.25 : 0.75;
            const rateVal = currentTrial.prosody === 'Flat' ? 1.15 : 0.92;
            const playBtn = document.getElementById('scenarioPlayBtn');

            // 1回目・2回目に関わらず、押した瞬間に「再生中」へリセット
            document.getElementById('playStatusBadge').textContent = "音声を再生中...";
            document.getElementById('playSubLabel').innerHTML = "<span>再生中...</span>";
            playBtn.classList.remove('border-slate-200', 'bg-slate-50');
            playBtn.classList.add('border-sky-400', 'bg-sky-50');

            playAudioFile(currentTrial.audioFile, currentTrial.text, pitchVal, rateVal, () => {
                // 再生が完全に終わった瞬間に「再生完了／もう一度聞く」へ戻す
                document.getElementById('playStatusBadge').textContent = "✓ 再生完了";
                document.getElementById('playSubLabel').innerHTML = "<span>↻ もう一度聞く</span>";
                playBtn.classList.remove('border-sky-400', 'bg-sky-50');
                playBtn.classList.add('border-slate-200', 'bg-slate-50');

                if (!audioFinishedOnce) {
                    audioFinishedOnce = true;
                    decisionStartTime = performance.now();

                    document.getElementById('btnChoiceA').disabled = false;
                    document.getElementById('btnChoiceB').disabled = false;

                    const banner = document.getElementById('audioInstructionBanner');
                    banner.className = "text-xs font-semibold text-emerald-600 flex items-center space-x-1";
                    banner.innerHTML = "<span>✓ 音声が終了しました 当てはまる方のボタンを押してください</span>";
                }
            });
        }

        function handleDecision(choice) {
            if (selectedChoice || !audioFinishedOnce) return;

            const clickTime = performance.now();
            reactionTimeMs = Number(((clickTime - decisionStartTime) / 1000).toFixed(2));
            selectedChoice = choice;

            document.querySelectorAll('.decision-btn').forEach(btn => {
                btn.blur();
                if (btn.dataset.value === choice) {
                    btn.classList.remove('border-slate-200', 'bg-white');
                    btn.classList.add('border-sky-400', 'bg-sky-100');
                }
            });

            document.getElementById('anxietyBox').classList.remove('hidden');
            document.getElementById('anxietyBox').scrollIntoView({ behavior: 'smooth' });
        }

        const RATING_LABELS = {
            1: "非常に信頼できる",
            2: "やや信頼できる",
            3: "どちらとも言えない",
            4: "やや不安に思う",
            5: "非常に不安に思う"
        };

        function handleAnxietyRating(score) {
            selectedAnxiety = RATING_LABELS[score];

            const buttons = document.querySelectorAll('.likert-btn');
            buttons.forEach((btn, idx) => {
                btn.blur();
                if (idx + 1 === score) {
                    btn.classList.remove('border-slate-200', 'bg-white');
                    btn.classList.add('bg-sky-100', 'border-sky-400', 'text-sky-900');
                } else {
                    btn.classList.remove('bg-sky-100', 'border-sky-400', 'text-sky-900');
                    btn.classList.add('border-slate-200', 'bg-white');
                }
            });

            document.getElementById('btnNextTrial').disabled = false;
        }

        function submitTrialAndNext() {
            const currentTrial = TRIAL_CONFIG[currentTrialIndex];

            expState.results.push({
                participantId: expState.participant.id,
                age: expState.participant.age,
                gender: expState.participant.gender,
                trialOrder: currentTrialIndex + 1,
                conditionId: currentTrial.id,
                framing: currentTrial.framing,
                pitch: currentTrial.pitch,
                prosody: currentTrial.prosody,
                choice: selectedChoice,
                reactionTime: reactionTimeMs,
                ratingScore: selectedAnxiety,
                timestamp: new Date().toISOString()
            });

            saveExpState(expState);

            const nextIndex = currentTrialIndex + 1;
            if (nextIndex < TRIAL_CONFIG.length) {
                loadTrial(nextIndex);
                window.scrollTo(0, 0);
            } else {
                window.location.href = 'data_send.html';
            }
        }
    </script>
</body>
</html>
