<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実験終了</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="w-full bg-white shadow-sm border-b border-slate-200 py-4 px-6 mb-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-sky-400 flex items-center justify-center text-white">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24">
        <path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4" />
    </svg>
</div>
                <h1 class="text-lg font-semibold text-slate-900">AI音声が与える心理的影響についての聴取実験</h1>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto w-full px-4 mb-12 flex-grow">
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 text-center space-y-6">
            <div>
                <h2 class="text-2xl font-bold text-slate-900">すべての実験が完了しました</h2>
                <p class="text-sm text-slate-500 mt-1">ご協力いただきありがとうございました</p>
           		<p class="text-sm text-slate-500 mt-1">下のボタンを押してデータを送信してください</p>
            </div>

            <!-- GAS 送信ボタン -->
            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                <button type="button" id="btnSubmitGAS" onclick="submitDataToGAS()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-6 rounded-xl transition shadow-md flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span>データを送信する</span>
                </button>
                <p id="gasStatus" class="text-xs font-semibold mt-2"></p>
            </div>

            <!-- 送信できない場合 -->
            <div class="pt-4 border-t border-slate-200">
                <p class="text-xs text-slate-400 mb-3">送信できない場合はお手数ですがクリップボードへコピー➡LINEまたはDMに送信をお願いします</p>
                <div class="flex flex-col sm:flex-row gap-3">
                    <button type="button" onclick="copyToClipboard()" class="flex-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-2.5 px-4 rounded-xl transition text-xs flex items-center justify-center space-x-1">
                        <span>クリップボードへコピー</span>
                    </button>
                </div>
                <p id="exportToast" class="text-xs text-emerald-600 font-medium hidden mt-2">✓ クリップボードへコピーしました</p>
            </div>

            <div class="text-left space-y-2 pt-2">
                <span class="text-xs font-bold text-slate-400 uppercase">送信データのプレビュー</span>
                <div class="text-xs font-mono bg-slate-900 text-slate-200 p-3 rounded-lg overflow-x-auto max-h-36" id="dataPreview">
                </div>
            </div>
        </section>
    </main>

    <script src="common.js"></script>
    <script>
        const expState = loadExpState();
        if (!expState.participant.id || expState.results.length === 0) {
            window.location.href = 'index.html';
        }

        document.getElementById('dataPreview').textContent = JSON.stringify(expState.results, null, 2);

        function submitDataToGAS() {
            const statusDiv = document.getElementById('gasStatus');
            const submitBtn = document.getElementById('btnSubmitGAS');

            if (!GAS_URL || GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
                statusDiv.className = "text-xs font-semibold text-rose-600 mt-2";
                statusDiv.innerText = "エラー: GASのURLがコードに設定されていません。";
                return;
            }

            submitBtn.disabled = true;
            statusDiv.className = "text-xs font-semibold text-slate-600 mt-2";
            statusDiv.innerText = "データを送信中...";

            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(expState.results)
            })
            .then(() => {
                statusDiv.className = "text-xs font-semibold text-emerald-600 mt-2";
                statusDiv.innerText = "✓ データが送信されました";
                submitBtn.classList.add("hidden");
            })
            .catch(err => {
                console.error(err);
                statusDiv.className = "text-xs font-semibold text-rose-600 mt-2";
                statusDiv.innerText = "送信エラーが発生しました　再試行するか結果データをコピーしてください";
                submitBtn.disabled = false;
            });
        }

        function generateCSV() {
            const headers = [
                'ParticipantID', 'Age', 'Gender', 'TrialOrder', 'ConditionID',
                'Framing', 'Pitch', 'Prosody', 'Choice', 'ReactionTime_ms', 'RatingScore', 'Timestamp'
            ];
            const rows = expState.results.map(r => [
                r.participantId, r.age, r.gender, r.trialOrder, r.conditionId,
                r.framing, r.pitch, r.prosody, r.choice, r.reactionTimeMs, r.ratingScore, r.timestamp
            ]);
            return [headers, ...rows].map(e => e.join(",")).join("\n");
        }

        function downloadCSV() {
            const csvContent = "\uFEFF" + generateCSV();
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `exp_${expState.participant.id}_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(generateCSV()).then(() => {
                const toast = document.getElementById('exportToast');
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 3000);
            });
        }
    </script>
</body>
</html>
